name: Dispatch Web Sync

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/assets/opusone.db'
  workflow_dispatch:

jobs:
  dispatch:
    # Forked repositories must not dispatch events into the upstream web repo.
    if: github.repository == 'wg2038/cicada930'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Web Sync
        run: |
          echo "Dispatching database update event to wg2038/cicada930-web..."
          TOKEN="${{ secrets.SYNC_WEB_TOKEN || secrets.GITHUB_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::未配置 SYNC_WEB_TOKEN，跳过跨仓库通知。"
            exit 0
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/wg2038/cicada930-web/dispatches \
            -d "{\"event_type\":\"upstream_db_updated\",\"client_payload\":{\"commit\":\"${{ github.sha }}\"}}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response status: $http_code"
          if [ "$http_code" = "204" ]; then
            echo "✓ Successfully dispatched upstream_db_updated event to wg2038/cicada930-web."
          else
            echo "::warning::Cross-repo dispatch returned HTTP $http_code: $body"
            echo "::notice::Default GITHUB_TOKEN lacks permissions across repositories. To enable automatic dispatch, set SYNC_WEB_TOKEN (PAT with repo scope) in Settings -> Secrets -> Actions."
          fi
