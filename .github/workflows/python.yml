name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'etl/**'
      - 'opusone-corpus/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'etl/**'
      - 'opusone-corpus/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Corpus & Pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax & Lint Check
        run: |
          flake8 etl --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Corpus Integrity
        run: |
          python etl/verify_corpus.py

      - name: Verify Committed Assets Database
        run: |
          python etl/verify_db.py app/src/main/assets/opusone.db --committed

      - name: Build Database from Corpus & Verify
        run: |
          python etl/build_from_corpus.py /tmp/test_opusone.db
          python etl/verify_db.py /tmp/test_opusone.db
